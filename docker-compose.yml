services:
  backend:
    image: node:20-alpine
    working_dir: /app/servidor
    command: sh -c "npm install && npm run dev"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: ${PORT:-5000}
    volumes:
      - ./proyecto-app/servidor:/app/servidor
    ports:
      - "5000:5000"

  frontend:
    image: node:20-alpine
    working_dir: /app/client
    command: sh -c "npm install && npm start"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WDS_SOCKET_PORT: 0
    volumes:
      - ./proyecto-app/client:/app/client
    ports:
      - "3000:3000"
    depends_on:
      - backend
