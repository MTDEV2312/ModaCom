services:
  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci --include=dev && npm run build && npm run start"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    volumes:
      - ./proyecto-app/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

  backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci --include=dev && npm run build && npm start"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      BACKEND_PORT: ${BACKEND_PORT:-5000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DATABASE_URL: mysql://${MYSQL_ADDON_USER}:${MYSQL_ADDON_PASSWORD}@mysql:3306/${MYSQL_ADDON_DB}
    volumes:
      - ./proyecto-app/backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "${BACKEND_PORT:-5000}:${BACKEND_PORT:-5000}"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ADDON_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_ADDON_DB}
      MYSQL_USER: ${MYSQL_ADDON_USER}
      MYSQL_PASSWORD: ${MYSQL_ADDON_PASSWORD}
    ports:
      - "${MYSQL_ADDON_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ADDON_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  backend_node_modules:
  web_node_modules:
  web_next:
